<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter for Mum</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-[#F8F3E7] text-[#183C2B]">

    <!-- Decorative background elements -->
    <div class="leaf leaf-one">✦</div>
    <div class="leaf leaf-two">❋</div>
    <div class="leaf leaf-three">✦</div>

    <main class="flex min-h-screen items-center justify-center px-6 py-12">

        <section class="text-center">

            <p class="mb-4 text-sm uppercase tracking-[0.35em] text-[#B99A5B]">
                A special birthday surprise
            </p>

            <h1 class="serif-font mb-3 text-4xl font-semibold text-[#183C2B] md:text-6xl">
                For My Mum
            </h1>

            <p class="mb-12 text-lg text-[#52665A]">
                A little letter, filled with a lot of love.
            </p>

            <!-- Envelope -->
            <div class="envelope-wrapper mx-auto">

                <div class="envelope">

                    <!-- Envelope flap -->
                    <div class="envelope-flap"></div>

                    <!-- Letter inside -->
                    <div class="envelope-letter">
                        <span class="text-2xl">🤍</span>
                    </div>

                    <!-- Envelope front -->
                    <div class="envelope-front">
                        <div class="envelope-line-left"></div>
                        <div class="envelope-line-right"></div>
                    </div>

                </div>

                <!-- Open button -->
                <a
                    href="letter.html"
                    class="mt-10 inline-flex items-center gap-3 rounded-full bg-[#183C2B] px-8 py-4 text-sm font-medium tracking-wide text-[#F8F3E7] shadow-lg transition duration-300 hover:-translate-y-1 hover:bg-[#28583F] hover:shadow-xl"
                >
                    Open your letter
                    <span>→</span>
                </a>

            </div>

            <p class="mt-10 text-xs tracking-widest text-[#8B927F]">
                MADE WITH LOVE
            </p>

        </section>

    </main>

</body>
</html>
